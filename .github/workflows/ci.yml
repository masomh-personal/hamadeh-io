name: CI

on:
    push:
        branches: [main, next-version]
    pull_request:
        branches: [main, next-version]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  # Reads packageManager from package.json so CI and local
                  # machines can never disagree about the Bun version.
                  bun-version-file: "package.json"

            - name: Cache Bun packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile
              env:
                  HUSKY: 0

            # next-env.d.ts is gitignored; generate it and route types so type-check succeeds
            - name: Generate Next.js types
              run: bun run typegen

            - name: Healthcheck
              run: bun run healthcheck

            - name: Audit dependencies
              run: bun audit

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: check
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  # Reads packageManager from package.json so CI and local
                  # machines can never disagree about the Bun version.
                  bun-version-file: "package.json"

            - name: Cache Bun packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile
              env:
                  HUSKY: 0

            - name: Build
              run: bun run build

            - name: Upload Next.js build artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: next-build
                  path: .next
                  include-hidden-files: true
                  retention-days: 1

    e2e:
        name: E2E
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  # Reads packageManager from package.json so CI and local
                  # machines can never disagree about the Bun version.
                  bun-version-file: "package.json"

            - name: Cache Bun packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile
              env:
                  HUSKY: 0

            - name: Download Next.js build artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: next-build
                  path: .next

            - name: Cache Playwright Chromium
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: bunx playwright install --with-deps chromium

            - name: Install Playwright OS dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: bunx playwright install-deps chromium

            - name: Run E2E tests
              run: bun run test:e2e

            - name: Upload Playwright failure artifacts
              if: ${{ !cancelled() && failure() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
